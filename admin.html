</head>
<body class="admin-page">
<div id="root"><main class="login-wrap"><div class="admin-startup glass-surface glass-on-media">
  <img src="/assets/brand/memory-icon.svg" alt="" width="46" height="46">
  <div class="admin-progress" role="status"><span class="admin-spinner" aria-hidden="true"></span><span id="startup-status">جارٍ فتح لوحة الإدارة…</span></div>
  <div class="admin-track" aria-hidden="true"></div>
</div></main></div>
<div id="toast" class="toast" role="status"></div>
<div id="modal-root"></div>
<script>
const root=document.getElementById('root'),toastEl=document.getElementById('toast');
const viewSources = {
  overview: { key: 'summary', path: '/api/admin/overview?summary=1', loading: 'جارٍ تحميل النظرة العامة…' },
  batches: { key: 'data', path: '/api/admin/overview', loading: 'جارٍ تحميل الدفعات والألبومات…' },
  media: { key: 'data', path: '/api/admin/overview', loading: 'جارٍ تحميل مكتبة الصور…' },
  users: { key: 'users', path: '/api/admin/users', loading: 'جارٍ تحميل المستخدمين…' },
  settings: { key: 'devices', path: '/api/auth/device', loading: 'جارٍ تحميل الأجهزة الموثوقة…' }
};
function newSession() {
  return {
    user: null, view: 'overview', summary: null, data: null, users: null, devices: null,
    selectedBatch: null, mediaCursor: '', viewError: '', requests: {},
    uploadQueue: [], uploadSettings: { album: '', prefix: '', published: false }
  };
}
let state = newSession();
const icons={grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',layers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg>',image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>',users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="m19.4 15 .1.1a2 2 0 1 1-2.8 2.8l-.1-.1a2 2 0 0 0-3.4 1.4v.3a2 2 0 1 1-4 0v-.2A2 2 0 0 0 5.8 18l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A2 2 0 0 0 1.6 12a2 2 0 1 1 0-4h.2a2 2 0 0 0 1.4-3.4l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A2 2 0 0 0 9.5.4V.2a2 2 0 1 1 4 0v.2a2 2 0 0 0 3.4 1.4l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A2 2 0 0 0 21.1 8h.3a2 2 0 1 1 0 4h-.2a2 2 0 0 0-1.8 3Z"/></svg>',menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>',plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4m0 0L7 9m5-5 5 5"/><path d="M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>',close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg>',edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 20 9-9-3-3-9 9-1 4 4-1Z"/><path d="m15 5 3 3"/></svg>',trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg>',refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 5v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 19v-4h-4"/></svg>',qr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z"/></svg>'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const fmtBytes=n=>{n=Number(n||0);if(!n)return'0 ب';const u=['ب','ك.ب','م.ب','ج.ب'];let i=0;while(n>=1024&&i<3){n/=1024;i++}return`${n.toFixed(i?1:0)} ${u[i]}`};
const fmtDate=v=>v?new Date(v.includes('T')?v:v.replace(' ','T')+'Z').toLocaleString('ar-IQ',{dateStyle:'medium',timeStyle:'short'}):'—';
function toast(msg,type='info'){toastEl.textContent=msg;toastEl.style.background=type==='error'?'#9b251c':type==='success'?'#147d4f':'#102a43';toastEl.classList.add('show');clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.classList.remove('show'),3500)}
async function api(url, options = {}) {
  const session = state;
  const response = await fetch(url, { credentials: 'same-origin', ...options });
  const body = response.status === 204 ? null : await response.json().catch(() => null);
  if (!response.ok) {
    if (response.status === 401 && state === session && state.user &&
        (url.startsWith('/api/admin/') || url === '/api/auth/device')) {
      endSession('انتهت الجلسة. سجّل الدخول مرة أخرى.');
    }
    throw Object.assign(Error(body?.error || 'تعذر تنفيذ الطلب'), { status: response.status });
  }
  if (body === null && response.status !== 204) throw Error('تعذّر قراءة استجابة الخادم');
  return body;
}
function sendJSON(url, method, data) {
  return api(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
}
function loadScript(path) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = path;
    script.onload = resolve;
    script.onerror = () => { script.remove(); reject(Error('تعذّر تحميل الملف. حاول مرة أخرى.')); };
    document.head.append(script);
  });
}
let glassScheduled = false;
function enhanceAdmin() {
  if (glassScheduled) return;
  glassScheduled = true;
  const load = () => {
    const style = document.createElement('link');
    style.rel = 'stylesheet';
    style.href = '/assets/zakiglass.css';
    style.media = 'print';
    style.addEventListener('load', () => {
      style.media = 'all';
      void loadScript('/assets/zakiglass.js').catch(() => {});
    }, { once: true });
    document.head.append(style);
  };
  if (window.requestIdleCallback) requestIdleCallback(load, { timeout: 600 });
  else setTimeout(load, 0);
}
function progressMarkup(message) {
  return `<div class="admin-progress" role="status"><span class="admin-spinner" aria-hidden="true"></span><span>${esc(message)}</span></div>
    <div class="admin-track" aria-hidden="true"></div>`;
}
function adminBrand() {
  return `<div class="memory-brand">
    <span class="memory-brand-mark"><img src="/assets/brand/memory-icon.svg" alt=""></span>
    <span class="memory-brand-name"><strong>ذاكرة الكلية</strong><small>لوحة الإدارة الأكاديمية</small></span>
  </div>`;
}
function submitButton(label) {
  return `<div class="admin-submit span-2" data-zaki-submit>
    <button class="btn btn-primary" type="submit" data-admin-fallback>${esc(label)}</button>
    <span data-admin-control></span>
    <div class="submit-progress" data-submit-progress hidden>${progressMarkup('')}</div>
  </div>`;
}
function setFormBusy(form, message = '') {
  const busy = Boolean(message);
  form.toggleAttribute('data-submitting', busy);
  const progress = form.querySelector('[data-submit-progress]');
  progress.hidden = !busy;
  progress.querySelector('.admin-progress span:last-child').textContent = message;
  form.querySelectorAll('button[type="submit"]').forEach(button => { button.disabled = busy; });
}
function login(error = '') {
  root.innerHTML = `<main class="login-wrap"><section class="login-card glass-surface">
    ${adminBrand()}
    <h1>مرحبًا بعودتك</h1>
    <p>أدر الدفعات والألبومات والصور وأسماء الطلبة.</p>
    <form id="loginForm" class="login-form">
      <div class="field"><label for="loginUsername">اسم المستخدم</label>
        <input class="input" id="loginUsername" name="username" required autocomplete="username" dir="ltr"></div>
      <div class="field"><label for="loginPassword">كلمة المرور</label>
        <input class="input" type="password" id="loginPassword" name="password" required autocomplete="current-password"></div>
      <div class="login-note" role="alert" ${error ? '' : 'hidden'}>${esc(error)}</div>
      ${submitButton('دخول إلى لوحة التحكم')}
    </form>
  </section></main>`;
  root.dispatchEvent(new Event('admin:render'));
  enhanceAdmin();
  const form = document.getElementById('loginForm');
  form.onsubmit = async event => {
    event.preventDefault();
    if (form.hasAttribute('data-submitting')) return;
    const feedback = form.querySelector('[role="alert"]');
    feedback.hidden = true;
    setFormBusy(form, 'جارٍ تسجيل الدخول…');
    try {
      const { user } = await sendJSON('/api/auth/login', 'POST', Object.fromEntries(new FormData(form)));
      state.user = user;
      setFormBusy(form, 'جارٍ تجهيز لوحة الإدارة…');
      if (await loadView('overview')) render();
    } catch (error) {
      if (!form.isConnected) return;
      feedback.textContent = error.message;
      feedback.hidden = false;
      form.elements.password.value = '';
      form.elements.password.focus();
    } finally {
      setFormBusy(form);
    }
  };
}
function endSession(message) {
  document.querySelector('#modal-root dialog[open]')?.close();
  state = newSession();
  login(message);
}
function invalidate(key) {
  state[key] = null;
  state.requests[key] = (state.requests[key] || 0) + 1;
}
async function loadView(view) {
  const session = state;
  const { key, path } = viewSources[view];
  const request = session.requests[key] = (session.requests[key] || 0) + 1;
  const data = await api(path);
  if (state !== session || session.requests[key] !== request) return false;
  state[key] = data;
  if (data.user) state.user = data.user;
  if (key === 'data') {
    state.mediaCursor = '';
    if (!data.batches.some(batch => batch.id === state.selectedBatch)) state.selectedBatch = null;
  }
  return true;
}
async function loadStorage(summary) {
  if (summary.storagePending || summary.counts.storage_bytes !== undefined) return;
  summary.storagePending = true;
  const session = state;
  try {
    const { objects } = await api('/api/admin/media?limit=50');
    summary.counts.storage_bytes = objects.reduce((sum, object) => sum + object.size, 0);
  } catch {
    summary.counts.storage_bytes = null;
  }
  if (state !== session || state.summary !== summary) return;
  const value = document.getElementById('overviewStorage');
  if (value) value.innerHTML = storageValue(summary.counts.storage_bytes);
}
function storageValue(bytes) {
  if (bytes === undefined) return '<span class="admin-spinner" role="status" aria-label="جارٍ قياس حجم التخزين"></span>';
  if (bytes === null) return '<span aria-label="تعذّر تحميل حجم التخزين">—</span>';
  return esc(fmtBytes(bytes));
}
function layout(){return`<div class="shell"><aside id="sidebar" class="sidebar glass-surface glass-on-media">${adminBrand()}<nav class="nav" aria-label="أقسام لوحة الإدارة">${[['overview','grid','نظرة عامة'],['batches','layers','الدفعات والألبومات'],['media','image','مكتبة الصور'],...(state.user.role==='admin'?[['users','users','المستخدمون']]:[]),['settings','settings','الحساب والأمان']].map(([id,ic,label])=>`<button data-nav="${id}" class="${state.view===id?'active':''}" ${state.view===id?'aria-current="page"':''}>${icons[ic]}<span>${label}</span></button>`).join('')}</nav><div class="sidebar-footer">جلسة آمنة · ${esc(state.user.name)}<br><span>آخر مزامنة: الآن</span></div></aside><div id="sidebarScrim" class="sidebar-scrim" aria-hidden="true"></div><div class="main"><header class="topbar glass-surface" data-glass-backdrop><div class="topbar-heading"><button id="menuBtn" aria-label="فتح قائمة الإدارة" aria-controls="sidebar" aria-expanded="false" class="menu-btn glass-icon">${icons.menu}</button><div class="topbar-title"><h1 tabindex="-1">${pageTitle()}</h1></div></div><div class="top-actions"><button id="refreshBtn" class="btn btn-soft btn-small" aria-label="تحديث">${icons.refresh} <span class="top-action-label">تحديث</span></button><div class="avatar">${esc((state.user.name||'م')[0])}</div><button id="logoutBtn" class="btn btn-soft btn-small">خروج</button></div></header><main class="content">${pages()}</main></div></div>`}
function pageTitle(){return({overview:'نظرة عامة',batches:'الدفعات والألبومات',media:'مكتبة الصور والرفع',users:'المستخدمون والصلاحيات',settings:'الحساب والأمان'})[state.view]}
function pages() {
  const source = viewSources[state.view];
  const page = { overview: overviewPage, batches: batchesPage, media: mediaPage, users: usersPage, settings: settingsPage }[state.view];
  const content = state[source.key] ? page() : `<div class="card view-pending">${state.viewError
    ? `<p role="alert">${esc(state.viewError)}</p><button class="btn btn-soft" data-retry-view>إعادة المحاولة</button>`
    : progressMarkup(source.loading)}</div>`;
  return `<section class="page active">${content}</section>`;
}
function overviewPage(){const s=state.summary.counts;return`<div class="grid stats"><div class="card stat"><span class="stat-label">إجمالي الدفعات</span><strong class="stat-value">${s.batches||0}</strong><span class="stat-icon">${icons.layers}</span></div><div class="card stat"><span class="stat-label">الألبومات</span><strong class="stat-value">${s.albums||0}</strong><span class="stat-icon">${icons.grid}</span></div><div class="card stat"><span class="stat-label">الصور الموثقة</span><strong class="stat-value">${s.photos||0}</strong><span class="stat-icon">${icons.image}</span></div><div class="card stat"><span class="stat-label">حجم التخزين</span><strong class="stat-value stat-storage" id="overviewStorage">${storageValue(s.storage_bytes)}</strong><span class="stat-icon">${icons.upload}</span></div></div><div class="split" style="margin-top:22px"><section class="card"><div class="section-head" style="padding:0 20px"><div><h2>آخر الدفعات</h2><p>أحدث الدفعات في الأرشيف</p></div><button class="btn btn-soft btn-small" data-nav="batches">إدارة الدفعات</button></div><div>${state.summary.batches.map(batchRow).join('')||empty('لا توجد دفعات بعد')}</div></section><section class="card"><div class="section-head" style="padding:0 20px"><div><h2>آخر العمليات</h2><p>سجل النشاطات الإدارية</p></div></div><div>${state.summary.audit.slice(0,7).map(a=>`<div class="batch-row"><div class="row-copy"><strong>${esc(actionLabel(a.action))}</strong><small>${esc(entityLabel(a.entity_type))} · ${esc(a.name||a.username||'النظام')}</small></div><small class="muted">${fmtDate(a.created_at)}</small></div>`).join('')||empty('لا توجد عمليات بعد')}</div></section></div>`}
const entityLabel=type=>({session:'جلسة',batch:'دفعة',album:'ألبوم',student:'اسم طالب',photo:'صورة',image:'ملف صورة',user:'حساب'})[type]||type;
function actionLabel(a){return({create:'إضافة',update:'تعديل',delete:'حذف',upload:'رفع',login:'تسجيل دخول'})[a]||a}
function empty(t){return`<div class="empty">${esc(t)}</div>`}
function batchRow(b){const albums=b.albums||[],photos=b.photo_count??albums.reduce((n,a)=>n+(a.photos||[]).length,0);return`<div class="batch-row"><div class="batch-main"><div class="year-chip">${esc(b.year)}</div><div><strong>${esc(b.title)}</strong><small>${b.album_count??albums.length} ألبومات · ${photos} صور · ${b.published?'<span class="badge badge-green">منشورة</span>':'<span class="badge badge-gray">مسودة</span>'}</small></div></div><div class="batch-actions"><button class="btn btn-soft btn-small" data-edit-batch="${b.id}">${icons.edit} تعديل</button><button class="btn btn-soft btn-small" data-open-batch="${b.id}">التفاصيل</button>${state.user.role==='admin'?`<button class="btn btn-danger btn-small" data-delete-batch="${b.id}">حذف</button>`:''}</div></div>`}
function batchesPage() {
  if (state.selectedBatch) return batchDetails(state.selectedBatch);
  return `<div class="section-head"><div><h2>الدفعات والألبومات</h2><p>تحكم كامل بالمحتوى المنشور والمسودات والأسماء.</p></div>
    <button class="btn btn-primary admin-create-batch" data-new-batch>${icons.plus} إضافة دفعة</button></div>
    <section class="card">${(state.data.batches || []).map(batchRow).join('') || empty('ابدأ بإضافة أول دفعة')}</section>`;
}
function albumTagList(album) {
  if (!album.photos?.length) return '';
  return `<details class="album-tag-list"><summary>ربط أسماء بصور الألبوم (${album.photos.length})</summary>
    ${album.photos.map((photo, index) => `<div class="batch-row">
      <span class="album-tag-picture"><img src="${esc(photo.url)}" alt="" loading="lazy"><span>${esc(photo.caption || photo.alt_text || 'صورة ' + (index + 1))}</span></span>
      <button type="button" class="btn btn-soft btn-small" data-tag-photo="${photo.id}">تعديل الأسماء (${photo.student_ids?.length || 0})</button>
    </div>`).join('')}</details>`;
}

l" aria-label="حذف الاسم ${esc(s.full_name)}" data-delete-student="${s.id}">${icons.trash}</button>`:''}</div></div>`).join('')||empty('لا توجد أسماء')}</div></section></div>`}

function mediaRecords() {
  const photos = new Map();
  for (const batch of state.data.batches || []) {
    for (const album of batch.albums || []) {
      for (const photo of album.photos || []) {
        if (!photos.has(photo.object_key)) photos.set(photo.object_key, photo);
      }
    }
  }
  return (state.data.media?.objects || []).map(file => ({ ...file, ...photos.get(file.key) }));
}

function bindMediaControls() {
  const grid = document.getElementById('allMedia');
  const search = document.getElementById('mediaSearch');
  const emptyResults = document.createElement('p');
  emptyResults.className = 'empty';
  emptyResults.textContent = 'لا توجد ملفات مطابقة في هذه الصفحة.';
  emptyResults.hidden = true;
  grid.after(emptyResults);
  const cards = [...grid.querySelectorAll('[data-media-key]')];
  const toolbar = document.createElement('div');
  toolbar.className = 'toolbar media-selection-toolbar';
  toolbar.innerHTML = `<label class="media-select-all"><input type="checkbox"> تحديد الكل</label>
    <span class="muted" role="status"></span>
    <button class="btn btn-soft btn-small" type="button" data-clear-selection>إلغاء التحديد</button>
    <button class="btn btn-danger btn-small" type="button" data-delete-selection>حذف المحدد</button>`;
  toolbar.hidden = state.user.role !== 'admin';
  grid.before(toolbar);
  const selectAll = toolbar.querySelector('input');
  const status = toolbar.querySelector('[role="status"]');
  const clear = toolbar.querySelector('[data-clear-selection]');
  const remove = toolbar.querySelector('[data-delete-selection]');
  const visibleChecks = () => [...grid.querySelectorAll('.media-card:not([hidden]) [data-media-select]')];
  function update() {
    const count = selectedMedia().length;
    const total = visibleChecks().length;
    status.textContent = count ? `${count} صور محددة` : 'لم يتم تحديد صور';
    selectAll.checked = count > 0 && count === total;
    selectAll.indeterminate = count > 0 && count < total;
    selectAll.disabled = !total || remove.hasAttribute('aria-busy');
    clear.disabled = !count || remove.hasAttribute('aria-busy');
    remove.disabled = !count || remove.hasAttribute('aria-busy');
  }
  search.oninput = () => {
    const query = search.value.trim().toLowerCase();
    for (const card of cards) {
      card.hidden = !card.dataset.mediaKey.toLowerCase().includes(query);
      const checkbox = card.querySelector('[data-media-select]');
      if (card.hidden && checkbox) checkbox.checked = false;
    }
    emptyResults.hidden = !cards.length || cards.some(card => !card.hidden);
    update();
  };
  selectAll.onchange = () => {
    for (const checkbox of visibleChecks()) checkbox.checked = selectAll.checked;
    update();
  };
  clear.onclick = () => {
    for (const checkbox of visibleChecks()) checkbox.checked = false;
    update();
  };
  remove.onclick = async () => {
    const keys = selectedMedia();
    if (!keys.length || !confirm(`حذف ${keys.length} صورة؟ لا يمكن التراجع عن هذا الإجراء.`)) return;
    await runAction(remove, async () => {
      await sendJSON('/api/admin/media', 'DELETE', { keys });
      await updateAfterChange('تم حذف الصور المحددة');
    });
    if (toolbar.isConnected) update();
  };
  grid.addEventListener('change', event => { if (event.target.matches('[data-media-select]')) update(); });
  document.getElementById('mediaFirst').onclick = event => changeMediaPage(event.currentTarget, '');
  document.getElementById('mediaNext').onclick = event => changeMediaPage(event.currentTarget, state.data.media.pagination.cursor);
  update();
}

async function replaceMedia(input) {
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  const button = input.previousElementSibling;
  await runAction(button, async () => {
    const form = new FormData();
    form.append('file', file);
    form.append('key', input.dataset.replaceMedia);
    form.append('replace', '1');
    await api('/api/admin/upload', { method: 'POST', body: form });
    await updateAfterChange('تم استبدال الصورة');
  });
}

async function showView(view, batch = null) {
  const session = state;
  const { key } = viewSources[view];
  state.view = view;
  state.selectedBatch = batch;
  state.viewError = '';
  render();
  window.scrollTo(0, 0);
  (root.querySelector('#batch-details-title') || root.querySelector('.topbar-title h1')).focus({ preventScroll: true });
  if (state[key]) return;
  try {
    if (await loadView(view) && state.view === view) {
      render();
      const heading = root.querySelector('#batch-details-title') || root.querySelector('.topbar-title h1');
      heading.focus({ preventScroll: true });
    }
  } catch (error) {
    if (state !== session || state.view !== view) return;
    if (error.status === 403 && view === 'users') {
      invalidate('summary');
      await showView('overview');
      toast(error.message, 'error');
      return;
    }
    state.viewError = error.message;
    render();
  }
}

async function runAction(button, action) {
  if (button.disabled) return;
  const session = state;
  button.disabled = true;
  button.setAttribute('aria-busy', 'true');
  try { await action(); }
  catch (error) { if (state === session) toast(error.message, 'error'); }
  finally {
    button.removeAttribute('aria-busy');
    button.disabled = false;
  }
}

function refresh(button) {
  return runAction(button, async () => {
    const view = state.view;
    try {
      if (await loadView(view) && state.view === view) {
        if (button.id === 'refreshBtn') {
          for (const key of ['summary', 'data', 'users', 'devices']) {
            if (key !== viewSources[view].key) invalidate(key);
          }
        }
        state.viewError = '';
        render();
        toast('تم تحديث البيانات', 'success');
      }

      if (error.status === 403 && view === 'users' && state.view === view) {

async function updateAfterChange(message, changed = 'data') {
  const session = state;
  const view = state.view;
  const key = viewSources[view].key;
  if (changed !== key) invalidate(changed);
  if (key !== 'summary') invalidate('summary');
  try {
    if (key === changed || key === 'summary') {
      if (await loadView(view) && state.view === view) render();
    }
    if (state === session) toast(message, 'success');
  } catch {

function bindEntityForm(dialog, save, message, { pending = 'جارٍ حفظ البيانات…', onSaved } = {}) {

  feedback.setAttribute('role', 'alert');
  feedback.hidden = true;
  form.insertBefore(feedback, form.querySelector('.admin-submit'));
  form.onsubmit = async event => {
    event.preventDefault();
    if (form.hasAttribute('data-submitting')) return;
    feedback.hidden = true;
    const fields = new FormData(form);
    const data = Object.fromEntries(fields);
    if (form.elements.published) data.published = form.elements.published.checked;
    setFormBusy(form, pending);
    close.disabled = true;
    const session = state;
    try {
      const result = await save(data, fields);
      if (state !== session) return;
      if (onSaved) await onSaved(message, result);
      else await updateAfterChange(message);
      if (dialog.open) dialog.close();
    } catch (error) {
      if (!dialog.open) return;
      feedback.textContent = error.message;
      feedback.hidden = false;
      feedback.scrollIntoView({ block: 'nearest' });
    } finally {
      setFormBusy(form);
      close.disabled = false;
    }
  };
}

function bindUploads() {

  const prefix = document.getElementById('uploadPrefix');
  const published = document.getElementById('uploadPublished');
  const input = document.getElementById('fileInput');
  const drop = document.getElementById('dropzone');
  const draw = () => drawUploads(session);

  if (album.selectedIndex === -1) album.value = '';
  prefix.value = session.uploadSettings.prefix;
  published.checked = session.uploadSettings.published;

  prefix.oninput = () => { session.uploadSettings.prefix = prefix.value; };
  published.onchange = () => { session.uploadSettings.published = published.checked; };

  function add(files) {
    if (session.uploading) return;
    const accepted = [...files].filter(file => /^image\/(jpeg|png|webp)$/.test(file.type) && file.size > 0 && file.size <= 20 * 1024 * 1024)
      .slice(0, 50 - session.uploadQueue.length);
    if (files.length > accepted.length) toast('تم تجاوز حد القائمة أو تجاهل ملفات غير مدعومة أو أكبر من 20 ميغابايت', 'error');

    event.preventDefault();
    drop.classList.add('drag');
  });
  for (const type of ['dragleave', 'drop']) drop.addEventListener(type, event => {
    event.preventDefault();
    drop.classList.remove('drag');
  });

    async function worker() {

        const item = jobs[next++];
        Object.assign(item, { state: 'uploading', message: 'جارٍ الرفع', progress: 0 });
        draw();
        try {
          await uploadOne(item, settings, draw);
          Object.assign(item, { state: 'done', message: 'تم الرفع', progress: 100 });
        } catch (error) {
          Object.assign(item, { state: 'failed', message: error.message });
          if (error.status === 401 && state === session) endSession('انتهت الجلسة. سجّل الدخول مرة أخرى.');

      }
    }
    try { await Promise.all(Array.from({ length: Math.min(4, jobs.length) }, worker)); }
    finally { session.uploading = false; draw(); }
    if (state !== session) return;
    const failed = jobs.filter(item => item.state === 'failed').length;
    if (failed) {
      invalidate('summary');
      try { if (await loadView('media') && state.view === 'media') render(); }
      catch { /* per-file results remain visible */ }
      if (state === session) toast(`تعذّر رفع ${failed} ملف. يمكنك إعادة المحاولة.`, 'error');
    } else await updateAfterChange('اكتمل رفع الصور');
  };
  draw();
}
function uploadOne(item,{album,published,prefix},draw){
  const name=item.file.name.normalize('NFKD').replace(/[^a-zA-Z0-9._-]/g,'-').slice(-120);
  const folder=prefix?prefix+'/':'';
  item.key ||= `${folder}${crypto.randomUUID()}-${name}`;
  const form=new FormData();
  form.append('file',item.file);
  form.append('key',item.key);
  form.append('upload_id',item.key);
  if(album)form.append('album_id',album);
  if(published)form.append('published','1');
  return new Promise((resolve,reject)=>{
    const xhr=new XMLHttpRequest();
    xhr.open('POST','/api/admin/upload');
    xhr.timeout=120000;
    xhr.upload.onprogress=event=>{
      if(event.lengthComputable){item.progress=Math.round(event.loaded/event.total*100);draw()}
    };
    xhr.onload=()=>{
      if(xhr.status>=200&&xhr.status<300)resolve();
      else reject(Object.assign(Error(xhr.response?.error || 'تعذّر رفع الملف'), { status: xhr.status }));
    };
    xhr.onerror=()=>reject(Error('انقطع الاتصال أثناء رفع الملف'));
    xhr.ontimeout=()=>reject(Error('انتهت مهلة رفع الملف'));
    xhr.responseType='json';
    xhr.send(form);
  });
}
async function initialize() {
  const url = new URL(location.href);
  const token = new URLSearchParams(url.hash.slice(1)).get('device') || url.searchParams.get('device');
  try {
    if (token) {
      document.getElementById('startup-status').textContent = 'جارٍ تسجيل الدخول السريع…';
      history.replaceState(null, '', '/admin');
      await sendJSON('/api/auth/device', 'PUT', { token });
    }
    if (await loadView('overview')) render();
  } catch (error) {
    endSession(error.status === 401 ? '' : error.message);
  }
}
initialize();
</script>
