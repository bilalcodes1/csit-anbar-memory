<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>إدارة ذاكرة الكلية</title>
  <script src="/assets/qr.js" defer></script>
  <link rel="icon" href="assets/brand/memory-icon.svg">
  <link rel="stylesheet" href="/assets/liquid-glass.css">
  <link rel="stylesheet" href="/assets/admin.css">
  <link rel="stylesheet" href="/assets/zakiglass.css">
  <script src="/assets/zakiglass.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Noto+Kufi+Arabic:wght@400;500;600;700&amp;display=swap">
</head>
<body class="admin-page">
<div id="root"><main class="login-wrap"><p role="status" style="color:white">جارٍ تحميل لوحة الإدارة…</p></main></div>
<div id="toast" class="toast" role="status"></div>
<div id="modal-root"></div>
<script>
const root=document.getElementById('root'),toastEl=document.getElementById('toast');
let state={user:null,view:'overview',data:null,selectedBatch:null,uploadQueue:[],devices:[]};
const icons={grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',layers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg>',image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>',users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="m19.4 15 .1.1a2 2 0 1 1-2.8 2.8l-.1-.1a2 2 0 0 0-3.4 1.4v.3a2 2 0 1 1-4 0v-.2A2 2 0 0 0 5.8 18l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A2 2 0 0 0 1.6 12a2 2 0 1 1 0-4h.2a2 2 0 0 0 1.4-3.4l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A2 2 0 0 0 9.5.4V.2a2 2 0 1 1 4 0v.2a2 2 0 0 0 3.4 1.4l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A2 2 0 0 0 21.1 8h.3a2 2 0 1 1 0 4h-.2a2 2 0 0 0-1.8 3Z"/></svg>',menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>',plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4m0 0L7 9m5-5 5 5"/><path d="M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>',close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg>',edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 20 9-9-3-3-9 9-1 4 4-1Z"/><path d="m15 5 3 3"/></svg>',trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg>',refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 5v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 19v-4h-4"/></svg>',qr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z"/></svg>'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const fmtBytes=n=>{n=Number(n||0);if(!n)return'0 ب';const u=['ب','ك.ب','م.ب','ج.ب'];let i=0;while(n>=1024&&i<3){n/=1024;i++}return`${n.toFixed(i?1:0)} ${u[i]}`};
const fmtDate=v=>v?new Date(v.includes('T')?v:v.replace(' ','T')+'Z').toLocaleString('ar-IQ',{dateStyle:'medium',timeStyle:'short'}):'—';
function toast(msg,type='info'){toastEl.textContent=msg;toastEl.style.background=type==='error'?'#9b251c':type==='success'?'#147d4f':'#102a43';toastEl.classList.add('show');clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.classList.remove('show'),3500)}
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',...opt});const b=r.status===204?null:await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(Error(b.error||'تعذر تنفيذ الطلب'),{status:r.status});return b}
function login(error=''){root.innerHTML=`<main class="login-wrap"><section class="login-card"><div class="login-brand"><img src="assets/brand/memory-icon.svg"><div><strong>ذاكرة الكلية</strong><small class="muted">لوحة الإدارة الأكاديمية</small></div></div><h1>مرحبًا بعودتك</h1><p>أدر الأرشيف والدفعات والصور والأسماء من مساحة واحدة آمنة.</p><form id="loginForm" class="login-form"><div class="field"><label for="loginUsername">اسم المستخدم<span class="hint">اكتب اسم المستخدم المسجل في النظام.</span></label><input class="input" id="loginUsername" name="username" required autocomplete="username" placeholder="مثال: bilalcodes1"></div><div class="field"><label for="loginPassword">كلمة المرور<span class="hint">أدخل كلمة مرور الحساب كما هي.</span></label><input class="input" type="password" id="loginPassword" name="password" required autocomplete="current-password" placeholder="كلمة المرور"></div><button class="btn btn-primary" type="submit">دخول إلى لوحة التحكم</button></form>${error?`<div class="login-note">${esc(error)}</div>`:`<div class="login-note">يمكنك استخدام باركود الدخول السريع من أجهزتك الموثوقة.</div>`}</section></main>`;document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;try{const d=await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});state.user=d.user;await boot()}catch(err){login(err.message)}finally{btn.disabled=false}}}
async function boot(){try{state.data=await api('/api/admin/overview');state.devices=await api('/api/auth/device');render()}catch(e){login(e.message)}}
function layout(){return`<div class="shell"><aside id="sidebar" class="sidebar glass-surface glass-on-media"><div class="brand"><img src="assets/brand/memory-icon.svg"><div><strong>ذاكرة الكلية</strong><span>الإدارة والتحرير</span></div></div><nav class="nav" aria-label="أقسام لوحة الإدارة">${[['overview','grid','نظرة عامة'],['batches','layers','الدفعات والألبومات'],['media','image','مكتبة الصور'],...(state.user.role==='admin'?[['users','users','المستخدمون']]:[]),['settings','settings','الحساب والأمان']].map(([id,ic,label])=>`<button data-nav="${id}" class="${state.view===id?'active':''}" ${state.view===id?'aria-current="page"':''}>${icons[ic]}<span>${label}</span></button>`).join('')}</nav><div class="sidebar-footer">جلسة آمنة · ${esc(state.user.name)}<br><span>آخر مزامنة: الآن</span></div></aside><div id="sidebarScrim" class="sidebar-scrim" aria-hidden="true"></div><div class="main"><header class="topbar glass-surface"><div class="topbar-heading"><button id="menuBtn" aria-label="فتح قائمة الإدارة" aria-controls="sidebar" aria-expanded="false" class="menu-btn glass-icon">${icons.menu}</button><div class="topbar-title"><h1 tabindex="-1">${pageTitle()}</h1></div></div><div class="top-actions"><button id="refreshBtn" class="btn btn-soft btn-small" aria-label="تحديث">${icons.refresh} <span class="top-action-label">تحديث</span></button><div class="avatar">${esc((state.user.name||'م')[0])}</div><button id="logoutBtn" class="btn btn-soft btn-small">خروج</button></div></header><main class="content">${pages()}</main></div></div>`}
function pageTitle(){return({overview:'نظرة عامة',batches:'الدفعات والألبومات',media:'مكتبة الصور والرفع',users:'المستخدمون والصلاحيات',settings:'الحساب والأمان'})[state.view]}
function pages(){return`<section class="page ${state.view==='overview'?'active':''}">${overviewPage()}</section><section class="page ${state.view==='batches'?'active':''}">${batchesPage()}</section><section class="page ${state.view==='media'?'active':''}">${mediaPage()}</section><section class="page ${state.view==='users'?'active':''}">${state.user.role==='admin'?usersPage():''}</section><section class="page ${state.view==='settings'?'active':''}">${settingsPage()}</section>`}
function overviewPage(){const s=state.data.counts||{};return`<div class="grid stats"><div class="card stat"><span class="stat-label">إجمالي الدفعات</span><strong class="stat-value">${s.batches||0}</strong><span class="stat-icon">${icons.layers}</span></div><div class="card stat"><span class="stat-label">الألبومات</span><strong class="stat-value">${s.albums||0}</strong><span class="stat-icon">${icons.grid}</span></div><div class="card stat"><span class="stat-label">الصور الموثقة</span><strong class="stat-value">${s.photos||0}</strong><span class="stat-icon">${icons.image}</span></div><div class="card stat"><span class="stat-label">حجم التخزين</span><strong class="stat-value stat-storage">${fmtBytes(s.storage_bytes)}</strong><span class="stat-icon">${icons.upload}</span></div></div><div class="split" style="margin-top:22px"><section class="card"><div class="section-head" style="padding:0 20px"><div><h2>آخر الدفعات</h2><p>أحدث الدفعات في الأرشيف</p></div><button class="btn btn-soft btn-small" data-nav="batches">إدارة الدفعات</button></div><div>${(state.data.batches||[]).slice(0,5).map(batchRow).join('')||empty('لا توجد دفعات بعد')}</div></section><section class="card"><div class="section-head" style="padding:0 20px"><div><h2>آخر العمليات</h2><p>سجل النشاطات الإدارية</p></div></div><div>${(state.data.audit||[]).slice(0,7).map(a=>`<div class="batch-row"><div class="row-copy"><strong>${esc(actionLabel(a.action))}</strong><small>${esc(entityLabel(a.entity_type))} · ${esc(a.name||a.username||'النظام')}</small></div><small class="muted">${fmtDate(a.created_at)}</small></div>`).join('')||empty('لا توجد عمليات بعد')}</div></section></div>`}
const entityLabel=type=>({session:'جلسة',batch:'دفعة',album:'ألبوم',student:'اسم طالب',photo:'صورة',image:'ملف صورة',user:'حساب'})[type]||type;
function actionLabel(a){return({create:'إضافة',update:'تعديل',delete:'حذف',upload:'رفع',login:'تسجيل دخول'})[a]||a}
function empty(t){return`<div class="empty">${esc(t)}</div>`}
function batchRow(b){const albums=b.albums||[],photos=albums.reduce((n,a)=>n+(a.photos||[]).length,0);return`<div class="batch-row"><div class="batch-main"><div class="year-chip">${esc(b.year)}</div><div><strong>${esc(b.title)}</strong><small>${albums.length} ألبومات · ${photos} صور · ${b.published?'<span class="badge badge-green">منشورة</span>':'<span class="badge badge-gray">مسودة</span>'}</small></div></div><div class="batch-actions"><button class="btn btn-soft btn-small" data-edit-batch="${b.id}">${icons.edit} تعديل</button><button class="btn btn-soft btn-small" data-open-batch="${b.id}">التفاصيل</button>${state.user.role==='admin'?`<button class="btn btn-danger btn-small" data-delete-batch="${b.id}">حذف</button>`:''}</div></div>`}
function batchesPage(){return`<div class="section-head"><div><h2>الدفعات والألبومات</h2><p>تحكم كامل بالمحتوى المنشور والمسودات والأسماء.</p></div><button class="btn btn-primary admin-create-batch" data-new-batch>${icons.plus} إضافة دفعة</button></div><section class="card">${(state.data.batches||[]).map(batchRow).join('')||empty('ابدأ بإضافة أول دفعة')}</section>${state.selectedBatch?batchDetails(state.selectedBatch):''}`}
function albumTagList(album) {
  if (!album.photos?.length) return '';
  return `<details class="album-tag-list"><summary>ربط أسماء بصور الألبوم (${album.photos.length})</summary>
    ${album.photos.map((photo, index) => `<div class="batch-row">
      <span class="album-tag-picture"><img src="${esc(photo.url)}" alt="" loading="lazy"><span>${esc(photo.caption || photo.alt_text || 'صورة ' + (index + 1))}</span></span>
      <button type="button" class="btn btn-soft btn-small" data-tag-photo="${photo.id}">تعديل الأسماء (${photo.student_ids?.length || 0})</button>
    </div>`).join('')}</details>`;
}
function batchDetails(id){const b=(state.data.batches||[]).find(x=>x.id===Number(id));if(!b)return'';return`<div class="section-head"><div><h2>تفاصيل دفعة ${esc(b.year)}</h2><p>${esc(b.title)} · ${b.published?'منشورة':'مسودة'}</p></div><button class="btn btn-gold" data-upload-for="${b.id}">${icons.upload} رفع صور لهذه الدفعة</button></div><div class="split"><section class="card"><div class="section-head" style="padding:0 20px"><div><h2>الألبومات</h2><p>أنشئ أقسام الذكريات ورتّبها.</p></div><button class="btn btn-soft btn-small" data-new-album="${b.id}">${icons.plus} ألبوم</button></div><div>${(b.albums||[]).map(a=>`<div class="batch-row"><div><strong>${esc(a.title)}</strong><small>${esc(a.subtitle||'بدون وصف')} · ${a.photos_count||0} صور · ${a.published?'منشور':'مسودة'}</small></div><div class="batch-actions"><button class="btn btn-soft btn-small" aria-label="تعديل ${esc(a.title)}" data-edit-album="${a.id}">${icons.edit}</button>${state.user.role==='admin'?`<button class="btn btn-danger btn-small" aria-label="حذف ${esc(a.title)}" data-delete-album="${a.id}">${icons.trash}</button>`:''}</div></div>${albumTagList(a)}`).join('')||empty('لا توجد ألبومات')}</div></section><section class="card"><div class="section-head" style="padding:0 20px"><div><h2>أسماء الطلبة</h2><p>أضف الأسماء مع التحكم بالنشر.</p></div><button class="btn btn-soft btn-small" data-new-student="${b.id}">${icons.plus} اسم</button></div><div>${(b.students||[]).map(s=>`<div class="batch-row"><div><strong>${esc(s.full_name)}</strong><small>${s.published?'<span class="badge badge-green">منشور</span>':'<span class="badge badge-gray">مسودة</span>'}</small></div><div class="batch-actions"><button class="btn btn-soft btn-small" data-edit-student="${s.id}">${icons.edit}</button><button class="btn btn-danger btn-small" data-delete-student="${s.id}">${icons.trash}</button></div></div>`).join('')||empty('لا توجد أسماء')}</div></section></div>`}
function mediaPage(){const files=state.data.media?.objects||[],counts=state.data.counts||{};return`<div class="section-head"><div><h2>مكتبة الصور والرفع الجماعي</h2><p>ارفع حتى 50 صورة في الدفعة الواحدة مع متابعة مستقلة لكل ملف.</p></div><button class="btn btn-soft" data-refresh-media>${icons.refresh} تحديث المكتبة</button></div><div class="split"><section class="card" style="padding:20px"><div class="field"><label>الدفعة والألبوم<span class="hint">اختياري، لكن اختياره يربط الصور بألبوم ويعرضها للزوار.</span></label><select id="uploadAlbum" class="select" aria-label="اختيار الألبوم"><option value="">اختر الألبوم لربط الصور به</option>${(state.data.batches||[]).flatMap(b=>(b.albums||[]).map(a=>`<option value="${a.id}" data-batch="${b.id}">${esc(b.year)} · ${esc(a.title)}</option>`)).join('')}</select></div><div class="dropzone" id="dropzone" style="margin-top:14px">${icons.upload}<strong>اسحب الصور هنا أو اخترها من الجهاز</strong><p>JPG وPNG وWebP · حتى 50 ملفًا · حتى 20 ميغابايت للصورة</p><button class="btn btn-gold" id="chooseFiles">اختيار الصور</button><input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" multiple class="hidden"></div><div class="toolbar" style="margin-top:14px"><input id="uploadPrefix" class="input" placeholder="مجلد اختياري مثل 2026/activities" aria-label="مجلد حفظ الصور"><div class="glass-switch-row" data-zaki-switch><label class="glass-switch-row" data-switch-fallback><input id="uploadPublished" type="checkbox" class="glass-switch" role="switch"> <span>نشر الصور فورًا</span></label><span data-switch-control></span></div><button class="btn btn-primary" id="startUploads" disabled>بدء الرفع</button><button class="btn btn-soft" id="clearUploads">مسح القائمة</button></div><div id="uploadList" class="upload-list"></div></section><section class="card" style="padding:20px"><div class="section-head" style="margin-top:0"><div><h2>إحصاءات التخزين</h2><p>إحصاءات الملفات المعروضة</p></div></div><div class="grid stats" style="grid-template-columns:repeat(2,1fr)"><div class="stat" style="background:#f8fafb"><span class="stat-label">الملفات</span><strong class="stat-value">${counts.media||files.length}</strong></div><div class="stat" style="background:#f8fafb"><span class="stat-label">الحجم</span><strong class="stat-value" style="font-size:22px">${fmtBytes(counts.storage_bytes)}</strong></div></div><div class="section-head"><div><h2>معاينة الملفات</h2><p>عينة من الصفحة الحالية</p></div></div><div class="media-grid">${files.slice(0,10).map(mediaCard).join('')||empty('لا توجد صور مرفوعة')}</div></section></div><section class="card" style="margin-top:18px;padding:20px"><div class="section-head" style="margin-top:0"><div><h2>كل الملفات</h2><p>ابحث ضمن الملفات المعروضة</p></div><input id="mediaSearch" class="input" style="max-width:280px" placeholder="بحث باسم الملف" aria-label="بحث باسم الملف"></div><div id="allMedia" class="media-grid">${files.map(mediaCard).join('')||empty('لا توجد صور')}</div><div class="toolbar" style="margin-top:14px"><button class="btn btn-soft" id="mediaFirst" ${state.mediaCursor?'':'hidden'}>الصفحة الأولى</button><button class="btn btn-soft" id="mediaNext" ${state.data.media?.pagination?.cursor?'':'hidden'}>الصفحة التالية</button></div></section>`}
function mediaCard(f){return`<article class="media-card"><img src="${esc(f.url||`/media/${f.key}`)}" alt="${esc(f.key)}" loading="lazy"><div class="media-body"><strong title="${esc(f.key)}">${esc(f.key.split('/').pop())}</strong><small>${fmtBytes(f.size)} · ${fmtDate(f.uploaded)}</small><div class="media-actions">${state.user.role==='admin'?`<button class="btn btn-danger btn-small" data-delete-media="${esc(f.key)}">${icons.trash} حذف</button>`:''}</div></div></article>`}
function usersPage(){const users=state.data.users||[];return`<div class="section-head"><div><h2>المستخدمون والصلاحيات</h2><p>إدارة المديرين والمشرفين وحالة الحساب.</p></div><button class="btn btn-primary" data-new-user>${icons.plus} إضافة مستخدم</button></div><section class="card table-wrap"><table class="table"><thead><tr><th>المستخدم</th><th>الدور</th><th>الحالة</th><th>تاريخ الإنشاء</th><th></th></tr></thead><tbody>${users.map(u=>`<tr><td><strong>${esc(u.name)}</strong><br><small class="muted">@${esc(u.username)}</small></td><td>${u.role==='admin'?'<span class="badge badge-gold">مدير</span>':'<span class="badge badge-gray">مشرف</span>'}</td><td>${u.active?'<span class="badge badge-green">نشط</span>':'<span class="badge badge-gray">معطل</span>'}</td><td>${fmtDate(u.created_at)}</td><td><div class="toolbar"><button class="btn btn-soft btn-small" data-edit-user="${u.id}">${icons.edit} تعديل</button><button class="btn btn-soft btn-small" data-toggle-user="${u.id}" data-role="${u.role}" data-active="${u.active?0:1}">${u.active?'تعطيل':'تفعيل'}</button><button class="btn btn-danger btn-small" data-delete-user="${u.id}">${icons.trash}</button></div></td></tr>`).join('')}</tbody></table></section>`}

  const chosen = new Set(file.student_ids || []);
  const list = form.querySelector('.photo-tag-list');
  function renderStudents() {
    const album = albums.find(item => item.id === Number(form.elements.album_id.value));

    list.innerHTML = students.map(student => `<label>
      <input type="checkbox" name="student_ids" value="${student.id}" ${chosen.has(student.id) ? 'checked' : ''}>

function bindSidebar() {
  const sidebar = document.getElementById('sidebar');
  const button = document.getElementById('menuBtn');
  const scrim = document.getElementById('sidebarScrim');
  if (!sidebar || !button || !scrim) return;

  function setOpen(open) {
    sidebar.classList.toggle('open', open);
    button.setAttribute('aria-expanded', String(open));
    button.setAttribute('aria-label', open ? 'إغلاق قائمة الإدارة' : 'فتح قائمة الإدارة');
  }

  button.addEventListener('click', () => {
    const opening = !sidebar.classList.contains('open');
    setOpen(opening);
    if (opening) requestAnimationFrame(() => {
      if (sidebar.classList.contains('open')) sidebar.querySelector('[aria-current], [data-nav]')?.focus();
    });
  });
  scrim.addEventListener('click', () => {
    setOpen(false);
    button.focus();
  });
}
document.addEventListener('keydown', event => {
  if (event.key !== 'Escape' || document.querySelector('dialog[open]')) return;
  const button = document.getElementById('menuBtn');
  if (button?.getAttribute('aria-expanded') !== 'true' || !button.getClientRects().length) return;
  event.preventDefault();
  button.click();
  button.focus();
});

async function changeMediaPage(cursor){
  try{
    state.data.media=await api('/api/admin/media?limit=50&cursor='+encodeURIComponent(cursor));
    state.mediaCursor=cursor;
    state.data.counts.media=state.data.media.objects.length;
    state.data.counts.storage_bytes=state.data.media.objects.reduce((sum,file)=>sum+file.size,0);
    render();
  }catch(error){toast(error.message,'error')}
}

function modal(title,body){
  const root=document.getElementById('modal-root');
  root.innerHTML=`<dialog class="modal" aria-labelledby="modal-title"><div class="modal-head glass-surface"><h2 id="modal-title">${esc(title)}</h2><button class="glass-icon" id="closeModal" type="button" aria-label="إغلاق">${icons.close}</button></div>${body}</dialog>`;
  const dialog=root.querySelector('dialog');
  dialog.querySelectorAll('.field').forEach((field,index)=>{
    const label=field.querySelector(':scope > label');
    const control=field.querySelector(':scope > input,:scope > select,:scope > textarea');
    if(label&&control){control.id='entity-field-'+index;label.htmlFor=control.id}
  });
  dialog.querySelector('#closeModal').onclick=()=>dialog.close();
  dialog.addEventListener('close',()=>dialog.remove(),{once:true});
  dialog.showModal();
  return dialog;
}

s="field span-2"><label>الوصف<span class="hint">نبذة تعريفية عن الدفعة، ويمكن تركها فارغة.</span></label><textarea class="textarea" name="description" placeholder="اكتب نبذة عن الدفعة...">${esc(b.description||'')}</textarea></div><div class="field span-2"><label>غلاف الدفعة<span class="hint">اختيار الغلاف يجعله ظاهرًا للزوار عند نشر الدفعة.</span></label><select name="cover_key" class="select"><option value="">بدون غلاف</option>${coverKeys.map(key=>`<option value="${esc(key)}" ${b.cover_key===key?'selected':''}>${esc(key)}</option>`).join('')}</select></div><div class="glass-switch-row span-2" data-zaki-switch><label class="glass-switch-row" data-switch-fallback><input name="published" type="checkbox" class="glass-switch" role="switch" ${b.published?'checked':''}> <span>نشر الدفعة للزوار</span></label><span data-switch-control></span></div><button class="btn btn-primary span-2">حفظ البيانات</button></form>`);m.querySelector('form').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.published=e.target.published.checked;try{await api(b.id?`/api/admin/batches/${b.id}`:'/api/admin/batches',{method:b.id?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});m.close();await refresh();toast('تم حفظ الدفعة','success')}catch(err){toast(err.message,'error')}}}

lose();await refresh();toast('تم حفظ الألبوم','success')}catch(err){toast(err.message,'error')}}}
function openStudentModal(batchId,s){const m=modal(s?'تعديل اسم':'إضافة اسم',`<form id="entityForm" class="form-grid">${s?'':'<div class="field span-2"><label>الدفعة<span class="hint">اختر الدفعة الخاصة بالطالب.</span></label><select class="select" name="batch_id" required>'+ (state.data.batches||[]).map(b=>`<option value="${b.id}" ${b.id==batchId?'selected':''}>${esc(b.year)} · ${esc(b.title)}</option>`).join('')+'</select></div>'}<div class="field span-2"><label>الاسم الكامل<span class="hint">اكتب الاسم كما تريد عرضه للزوار.</span></label><input class="input" name="full_name" required placeholder="مثال: أحمد محمد علي" value="${esc(s?.full_name||'')}"></div><div class="field"><label>الترتيب<span class="hint">رقم أصغر يظهر أولًا.</span></label><input class="input" name="sort_order" type="number" placeholder="0" value="${esc(s?.sort_order||0)}"></div><div class="glass-switch-row form-switch" data-zaki-switch><label class="glass-switch-row" data-switch-fallback><input name="published" type="checkbox" class="glass-switch" role="switch" ${s?.published?'checked':''}> <span>منشور</span></label><span data-switch-control></span></div><button class="btn btn-primary span-2">حفظ الاسم</button></form>`);m.querySelector('form').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.published=e.target.published.checked;if(s)d.id=s.id;try{await api('/api/admin/students',{method:s?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});m.close();await refresh();toast('تم حفظ الاسم','success')}catch(err){toast(err.message,'error')}}}
function openUserModal(u){const editing=Boolean(u);const m=modal(editing?'تعديل المستخدم':'إضافة مستخدم جديد',`<form id="entityForm" class="form-grid"><div class="field span-2"><label>الاسم<span class="hint">الاسم الظاهر داخل لوحة الإدارة.</span></label><input class="input" name="name" required placeholder="مثال: بلال زامل أحمد" value="${esc(u?.name||'')}"></div><div class="field"><label>اسم المستخدم<span class="hint">أحرف إنجليزية أو أرقام أو _ أو -، من 3 إلى 32 رمزًا.</span></label><input class="input" name="username" pattern="[a-zA-Z0-9_-]{3,32}" required placeholder="مثال: supervisor1" value="${esc(u?.username||'')}" ${editing?'disabled':''}></div><div class="field"><label>الدور<span class="hint">المدير يملك صلاحيات الإدارة الكاملة.</span></label><select class="select" name="role"><option value="editor" ${u?.role==='editor'?'selected':''}>مشرف</option><option value="admin" ${u?.role==='admin'?'selected':''}>مدير</option></select></div><div class="field span-2"><label>كلمة المرور ${editing?'الجديدة (اختياري)':''}<span class="hint">12 رمزًا على الأقل، واستخدم كلمة قوية.</span></label><input class="input" name="password" type="password" minlength="12" ${editing?'':'required'} placeholder="أدخل كلمة المرور"><small class="muted">12 رمزًا على الأقل</small></div><button class="btn btn-primary span-2">${editing?'حفظ التعديلات':'إنشاء الحساب'}</button></form>`);m.querySelector('form').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(editing)d.id=u.id;try{await api(editing?'/api/admin/users':'/api/admin/users',{method:editing?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});m.close();await refresh();toast(editing?'تم تعديل الحساب':'تم إنشاء الحساب','success')}catch(err){toast(err.message,'error')}}}
async function toggleUser(id,active,role){try{await api('/api/admin/users',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,active:Boolean(Number(active)),role})});await refresh();toast('تم تحديث حالة الحساب','success')}catch(e){toast(e.message,'error')}}
async function createDevice(){try{const d=await api('/api/auth/device',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({label:'جهاز موثوق'})});const m=modal('باركود الدخول السريع',`<div style="text-align:center"><p class="muted">احتفظ بهذا الرمز في جهازك. لا تشاركه مع الآخرين.</p><canvas id="qrCanvas"></canvas><p class="muted" style="font-size:12px">صالح لمدة 90 يومًا وقابل للإلغاء.</p></div>`);if(window.QRCode)QRCode.toCanvas(document.getElementById('qrCanvas'),location.origin+d.login_url,{width:250,margin:2});else document.getElementById('qrCanvas').insertAdjacentHTML('afterend','<p>تعذر تحميل مولد الباركود</p>');state.devices=await api('/api/auth/device')}catch(e){toast(e.message,'error')}}
async function revokeDevice(id){try{await api('/api/auth/device',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});state.devices=await api('/api/auth/device');render();toast('تم إلغاء الجهاز','success')}catch(e){toast(e.message,'error')}}
function bindUploads(){
  const input=document.getElementById('fileInput');
  const drop=document.getElementById('dropzone');
  const start=document.getElementById('startUploads');
  const clear=document.getElementById('clearUploads');
  const list=document.getElementById('uploadList');
  if(!input)return;
  const pending=()=>state.uploadQueue.filter(item=>item.state==='ready'||item.state==='failed');
  function draw(){
    list.innerHTML=state.uploadQueue.map(item=>`<div class="upload-item"><div><div class="file-name">${esc(item.file.name)}</div><div class="progress"><span style="width:${item.progress}%"></span></div></div><span class="status">${esc(item.message)}</span></div>`).join('');
    start.disabled=Boolean(state.uploading)||!pending().length;
    clear.disabled=Boolean(state.uploading)||!state.uploadQueue.length;
    document.getElementById('chooseFiles').disabled=Boolean(state.uploading);
  }
  function add(files){
    if(state.uploading)return;
    const accepted=[...files].filter(file=>/^image\/(jpeg|png|webp)$/.test(file.type)&&file.size>0&&file.size<=20*1024*1024)
      .slice(0,50-state.uploadQueue.length);
    if(files.length>accepted.length)toast('تم تجاوز حد القائمة أو تجاهل ملفات غير مدعومة أو أكبر من 20 ميغابايت','error');
    state.uploadQueue.push(...accepted.map(file=>({file,progress:0,state:'ready',message:'بانتظار الرفع'})));
    draw();
  }
  document.getElementById('chooseFiles').onclick=()=>input.click();
  input.onchange=()=>{add(input.files);input.value=''};
  ['dragenter','dragover'].forEach(type=>drop.addEventListener(type,event=>{event.preventDefault();drop.classList.add('drag')}));
  ['dragleave','drop'].forEach(type=>drop.addEventListener(type,event=>{event.preventDefault();drop.classList.remove('drag')}));
  drop.addEventListener('drop',event=>add(event.dataTransfer.files));
  clear.onclick=()=>{state.uploadQueue=[];draw()};
  start.onclick=async()=>{
    const jobs=pending();
    const settings={
      album:document.getElementById('uploadAlbum').value,
      published:document.getElementById('uploadPublished').checked,
      prefix:document.getElementById('uploadPrefix').value.trim().replace(/^\/+|\/+$/g,'')
    };
    if(settings.prefix&&!/^[a-zA-Z0-9_-]+(?:\/[a-zA-Z0-9_-]+)*$/.test(settings.prefix)){
      toast('اكتب مسارًا بأحرف إنجليزية وأرقام أو شرطات فقط','error');return;
    }
    if(settings.published&&!settings.album){toast('اختر ألبومًا قبل نشر الصور','error');return}
    state.uploading=true;
    draw();
    let cursor=0;
    async function worker(){
      while(cursor<jobs.length){
        const item=jobs[cursor++];
        item.state='uploading';item.message='جارٍ الرفع';item.progress=0;draw();
        try{await uploadOne(item,settings,draw);item.state='done';item.message='تم الرفع';item.progress=100}
        catch(error){item.state='failed';item.message=error.message}
        draw();
      }
    }
    try{await Promise.all(Array.from({length:Math.min(4,jobs.length)},worker))}
    finally{state.uploading=false;draw()}
    await refresh();
    const failed=jobs.filter(item=>item.state==='failed').length;
    toast(failed?`تعذّر رفع ${failed} ملف. يمكنك إعادة المحاولة.`:'اكتمل رفع الصور',failed?'error':'success');
  };
  draw();
}
function uploadOne(item,{album,published,prefix},draw){
  const name=item.file.name.normalize('NFKD').replace(/[^a-zA-Z0-9._-]/g,'-').slice(-120);
  const folder=prefix?prefix+'/':'';
  item.key ||= `${folder}${crypto.randomUUID()}-${name}`;
  const form=new FormData();
  form.append('file',item.file);
  form.append('key',item.key);
  form.append('upload_id',item.key);
  if(album)form.append('album_id',album);
  if(published)form.append('published','1');
  return new Promise((resolve,reject)=>{
    const xhr=new XMLHttpRequest();
    xhr.open('POST','/api/admin/upload');
    xhr.timeout=120000;
    xhr.upload.onprogress=event=>{
      if(event.lengthComputable){item.progress=Math.round(event.loaded/event.total*100);draw()}
    };
    xhr.onload=()=>{
      if(xhr.status>=200&&xhr.status<300)resolve();
      else reject(Error(xhr.response?.error||'تعذّر رفع الملف'));
    };
    xhr.onerror=()=>reject(Error('انقطع الاتصال أثناء رفع الملف'));
    xhr.ontimeout=()=>reject(Error('انتهت مهلة رفع الملف'));
    xhr.responseType='json';
    xhr.send(form);
  });
}
async function initialize(){
  const url=new URL(location.href);
  const token=new URLSearchParams(url.hash.slice(1)).get('device')||url.searchParams.get('device');
  if(token){
    history.replaceState(null,'','/admin');
    try{
      await api('/api/auth/device',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
    }catch(error){login(error.message);return}
  }
  try{state.user=await api('/api/auth/me');await boot()}
  catch(error){login(error.status===401?'':error.message)}
}
initialize();
</script>
