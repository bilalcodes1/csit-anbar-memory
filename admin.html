ogin-card{width:min(470px,100%);padding:34px;border-radius:30px;background:#fffffff4;box-shadow:0 28px 80px #0003}.login-brand{display:flex;align-items:center;gap:12px}.login-brand img{width:54px;height:54px;background:var(--deep);padding:6px;border-radius:18px}.login-card h1{font-family:'Noto Kufi Arabic';font-size:30px;margin:27px 0 8px}.login-card p{color:var(--muted);line-height:1.9;margin:0}.login-form{display:grid;gap:15px;margin-top:28px}.login-note{margin-top:18px;padding:12px 14px;background:#f4ede0;border-radius:13px;color:#755817;font-size:12px}.loading{padding:50px;text-align:center;color:var(--muted)}@media(min-width:900px){.sidebar{position:fixed;transform:none}.main{margin-left:278px}.menu-btn{display:none}}@media(max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.media-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:760px){.content{padding:20px 14px 45px}.topbar{padding:0 14px}.form-grid,.split{grid-template-columns:1fr}.span-2{grid-column:auto}.media-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.batch-row{align-items:flex-start;flex-direction:column}.batch-actions{width:100%}.batch-actions .btn{flex:1}.stats{gap:10px}.stat{padding:15px}.stat-value{font-size:25px}.sidebar{width:285px}}
    /* RTL layout overrides */
    html,body{direction:rtl}

<body>
<div id="root"><main class="login-wrap"><p role="status" style="color:white">جارٍ تحميل لوحة الإدارة…</p></main></div>
<div id="toast" class="toast" role="status"></div>
<div id="modal-root"></div>
<script>
const root=document.getElementById('root'),toastEl=document.getElementById('toast');
let state={user:null,view:'overview',data:null,selectedBatch:null,uploadQueue:[],devices:[]};
const icons={grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',layers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg>',image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>',users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="m19.4 15 .1.1a2 2 0 1 1-2.8 2.8l-.1-.1a2 2 0 0 0-3.4 1.4v.3a2 2 0 1 1-4 0v-.2A2 2 0 0 0 5.8 18l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A2 2 0 0 0 1.6 12a2 2 0 1 1 0-4h.2a2 2 0 0 0 1.4-3.4l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A2 2 0 0 0 9.5.4V.2a2 2 0 1 1 4 0v.2a2 2 0 0 0 3.4 1.4l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A2 2 0 0 0 21.1 8h.3a2 2 0 1 1 0 4h-.2a2 2 0 0 0-1.8 3Z"/></svg>',menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>',plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4m0 0L7 9m5-5 5 5"/><path d="M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>',close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg>',edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 20 9-9-3-3-9 9-1 4 4-1Z"/><path d="m15 5 3 3"/></svg>',trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg>',refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 5v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 19v-4h-4"/></svg>',qr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z"/></svg>'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const fmtBytes=n=>{n=Number(n||0);if(!n)return'0 ب';const u=['ب','ك.ب','م.ب','ج.ب'];let i=0;while(n>=1024&&i<3){n/=1024;i++}return`${n.toFixed(i?1:0)} ${u[i]}`};
const fmtDate=v=>v?new Date(v.includes('T')?v:v.replace(' ','T')+'Z').toLocaleString('ar-IQ',{dateStyle:'medium',timeStyle:'short'}):'—';
function toast(msg,type='info'){toastEl.textContent=msg;toastEl.style.background=type==='error'?'#9b251c':type==='success'?'#147d4f':'#102a43';toastEl.classList.add('show');clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.classList.remove('show'),3500)}
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',...opt});const b=r.status===204?null:await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(Error(b.error||'تعذر تنفيذ الطلب'),{status:r.status});return b}
function login(error=''){root.innerHTML=`<main class="login-wrap"><section class="login-card"><div class="login-brand"><img src="assets/brand/memory-icon.svg"><div><strong>ذاكرة الكلية</strong><small class="muted">لوحة الإدارة الأكاديمية</small></div></div><h1>مرحبًا بعودتك</h1><p>أدر الأرشيف والدفعات والصور والأسماء من مساحة واحدة آمنة.</p><form id="loginForm" class="login-form"><div class="field"><label for="loginUsername">اسم المستخدم<span class="hint">اكتب اسم المستخدم المسجل في النظام.</span></label><input class="input" id="loginUsername" name="username" required autocomplete="username" placeholder="مثال: bilalcodes1"></div><div class="field"><label for="loginPassword">كلمة المرور<span class="hint">أدخل كلمة مرور الحساب كما هي.</span></label><input class="input" type="password" id="loginPassword" name="password" required autocomplete="current-password" placeholder="كلمة المرور"></div><button class="btn btn-primary" type="submit">دخول إلى لوحة التحكم</button></form>${error?`<div class="login-note">${esc(error)}</div>`:`<div class="login-note">يمكنك استخدام باركود الدخول السريع من أجهزتك الموثوقة.</div>`}</section></main>`;document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;try{const d=await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});state.user=d.user;await boot()}catch(err){login(err.message)}finally{btn.disabled=false}}}
async function boot(){try{state.data=await api('/api/admin/overview');state.devices=await api('/api/auth/device');render()}catch(e){login(e.message)}}
function layout(){return`<div class="shell"><aside id="sidebar" class="sidebar"><div class="brand"><img src="assets/brand/memory-icon.svg"><div><strong>ذاكرة الكلية</strong><span>الإدارة والتحرير</span></div></div><nav class="nav">${[['overview','grid','نظرة عامة'],['batches','layers','الدفعات والألبومات'],['media','image','مكتبة الصور'],...(state.user.role==='admin'?[['users','users','المستخدمون']]:[]),['settings','settings','الحساب والأمان']].map(([id,ic,label])=>`<button data-nav="${id}" class="${state.view===id?'active':''}">${icons[ic]}<span>${label}</span></button>`).join('')}</nav><div class="sidebar-footer">جلسة آمنة · ${esc(state.user.name)}<br><span>آخر مزامنة: الآن</span></div></aside><div class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button id="menuBtn" aria-label="فتح قائمة الإدارة" aria-controls="sidebar" aria-expanded="false" class="menu-btn">${icons.menu}</button><div class="topbar-title"><h1>${pageTitle()}</h1><p>إدارة حقيقية مرتبطة ببيانات Cloudflare</p></div></div><div class="top-actions"><button id="refreshBtn" class="btn btn-soft btn-small">${icons.refresh} تحديث</button><div class="avatar">${esc((state.user.name||'م')[0])}</div><button id="logoutBtn" class="btn btn-soft btn-small">خروج</button></div></header><main class="content">${pages()}</main></div></div>`}
function pageTitle(){return({overview:'نظرة عامة',batches:'الدفعات والألبومات',media:'مكتبة الصور والرفع',users:'المستخدمون والصلاحيات',settings:'الحساب والأمان'})[state.view]}
function pages(){return`<section class="page ${state.view==='overview'?'active':''}">${overviewPage()}</section><section class="page ${state.view==='batches'?'active':''}">${batchesPage()}</section><section class="page ${state.view==='media'?'active':''}">${mediaPage()}</section><section class="page ${state.view==='users'?'active':''}">${state.user.role==='admin'?usersPage():''}</section><section class="page ${state.view==='settings'?'active':''}">${settingsPage()}</section>`}

function batchDetails(id){const b=(state.data.batches||[]).find(x=>x.id===Number(id));if(!b)return'';return`<div class="section-head"><div><h2>تفاصيل دفعة ${esc(b.year)}</h2><p>${esc(b.title)} · ${b.published?'منشورة':'مسودة'}</p></div><button class="btn btn-gold" data-upload-for="${b.id}">${icons.upload} رفع صور لهذه الدفعة</button></div><div class="split"><section class="card"><div class="section-head" style="padding:0 20px"><div><h2>الألبومات</h2><p>أنشئ أقسام الذكريات ورتّبها.</p></div><button class="btn btn-soft btn-small" data-new-album="${b.id}">${icons.plus} ألبوم</button></div><div>${(b.albums||[]).map(a=>`<div class="batch-row"><div><strong>${esc(a.title)}</strong><small>${esc(a.subtitle||'بدون وصف')} · ${a.photos_count||0} صور</small></div><div class="batch-actions"><button class="btn btn-soft btn-small" data-edit-album="${a.id}">${icons.edit}</button><button class="btn btn-danger btn-small" data-delete-album="${a.id}">${icons.trash}</button></div></div>`).join('')||empty('لا توجد ألبومات')}</div></section><section class="card"><div class="section-head" style="padding:0 20px"><div><h2>أسماء الطلبة</h2><p>أضف الأسماء مع التحكم بالنشر.</p></div><button class="btn btn-soft btn-small" data-new-student="${b.id}">${icons.plus} اسم</button></div><div>${(b.students||[]).map(s=>`<div class="batch-row"><div><strong>${esc(s.full_name)}</strong><small>${s.published?'<span class="badge badge-green">منشور</span>':'<span class="badge badge-gray">مسودة</span>'}</small></div><div class="batch-actions"><button class="btn btn-soft btn-small" data-edit-student="${s.id}">${icons.edit}</button><button class="btn btn-danger btn-small" data-delete-student="${s.id}">${icons.trash}</button></div></div>`).join('')||empty('لا توجد أسماء')}</div></section></div>`}
function mediaPage(){const files=state.data.media?.objects||[],counts=state.data.counts||{};return`<div class="section-head"><div><h2>مكتبة الصور والرفع الجماعي</h2><p>ارفع حتى 50 صورة في الدفعة الواحدة مع متابعة مستقلة لكل ملف.</p></div><button class="btn btn-soft" data-refresh-media>${icons.refresh} تحديث المكتبة</button></div><div class="split"><section class="card" style="padding:20px"><div class="field"><label>الدفعة والألبوم<span class="hint">اختياري، لكن اختياره يربط الصور بألبوم ويعرضها للزوار.</span></label><select id="uploadAlbum" class="select" aria-label="اختيار الألبوم"><option value="">اختر الألبوم لربط الصور به</option>${(state.data.batches||[]).flatMap(b=>(b.albums||[]).map(a=>`<option value="${a.id}" data-batch="${b.id}">${esc(b.year)} · ${esc(a.title)}</option>`)).join('')}</select></div><div class="dropzone" id="dropzone" style="margin-top:14px">${icons.upload}<strong>اسحب الصور هنا أو اخترها من الجهاز</strong><p>JPG وPNG وWebP · حتى 50 ملفًا · حتى 20 ميغابايت للصورة</p><button class="btn btn-gold" id="chooseFiles">اختيار الصور</button><input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" multiple class="hidden"></div><div class="toolbar" style="margin-top:14px"><input id="uploadPrefix" class="input" placeholder="مجلد اختياري مثل 2026/activities" aria-label="مجلد حفظ الصور"><label style="display:inline-flex;align-items:center;gap:7px;white-space:nowrap"><input id="uploadPublished" type="checkbox"> نشر الصور فورًا</label><button class="btn btn-primary" id="startUploads" disabled>بدء الرفع</button><button class="btn btn-soft" id="clearUploads">مسح القائمة</button></div><div id="uploadList" class="upload-list"></div></section><section class="card" style="padding:20px"><div class="section-head" style="margin-top:0"><div><h2>إحصاءات التخزين</h2><p>إحصاءات الملفات المعروضة</p></div></div><div class="grid stats" style="grid-template-columns:repeat(2,1fr)"><div class="stat" style="background:#f8fafb"><span class="stat-label">الملفات</ function mediaCard(f){return`<article class="media-card"><img src="${esc(f.url||`/media/${f.key}`)}" alt="${esc(f.key)}" loading="lazy"><div class="media-body"><strong title="${esc(f.key)}">${esc(f.key.split('/').pop())}</strong><small>${fmtBytes(f.size)} · ${fmtDate(f.uploaded)}</small><div class="media-actions">${state.user.role==='admin'?`<button class="btn btn-danger btn-small" data-delete-media="${esc(f.key)}">${icons.trash} حذف</button>`:''}</div></div></article>`}
function usersPage(){const users=state.data.users||[];return`<div class="section-head"><div><h2>المستخدمون والصلاحيات</h2><p>إدارة المديرين والمشرفين وحالة الحساب.</p></div><button class="btn btn-primary" data-new-user>${icons.plus} إضافة مستخدم</button></div><section class="card table-wrap"><table class="table"><thead><tr><th>المستخدم</th><th>الدور</th><th>الحالة</th><th>تاريخ الإنشاء</th><th></th></tr></thead><tbody>${users.map(u=>`<tr><td><strong>${esc(u.name)}</strong><br><small class="muted">@${esc(u.username)}</small></td><td>${u.role==='admin'?'<span class="badge badge-gold">مدير</span>':'<span class="badge badge-gray">مشرف</span>'}</td><td>${u.active?'<span class="badge badge-green">نشط</span>':'<span class="badge badge-gray">معطل</span>'}</td><td>${fmtDate(u.created_at)}</td><td><div class="toolbar"><button class="btn btn-soft btn-small" data-edit-user="${u.id}">${icons.edit} تعديل</button><button class="btn btn-soft btn-small" data-toggle-user="${u.id}" data-role="${u.role}" data-active="${u.active?0:1}">${u.active?'تعطيل':'تفعيل'}</button><button class="btn btn-danger btn-small" data-delete-user="${u.id}">${icons.trash}</button></div></td></tr>`).join('')}</tbody></table></section>`}
function settingsPage(){return`<div class="section-head"><div><h2>الحساب والأمان</h2><p>جلسة المستخدم والأجهزة الموثوقة والإعدادات الفعلية.</p></div></div><div class="split"><section class="card" style="padding:22px"><h2 class="display" style="font-size:19px">الحساب الحالي</h2><div class="batch-row" style="padding-right:0;padding-left:0"><div><strong>${esc(state.user.name)}</strong><small>@${esc(state.user.username)} · ${state.user.role==='admin'?'مدير':'مشرف'}</small></div><span class="badge badge-green">جلسة نشطة</span></div><button class="btn btn-danger" id="logoutSettings">تسجيل الخروج من هذا الجهاز</button></section><section class="card" style="padding:22px"><div class="section-head" style="margin-top:0"><div><h2>الدخول السريع</h2><p>باركودات هذا الحساب قابلة للإلغاء.</p></div><button class="btn btn-gold btn-small" id="newDevice">${icons.qr} توليد</button></div><div>${state.devices.filter(d=>!d.revoked).map(d=>`<div class="batch-row" style="padding-right:0;padding-left:0"><div><strong>${esc(d.label)}</strong><small>آخر استخدام: ${fmtDate(d.last_used_at)}</small></div><button class="btn btn-danger btn-small" data-revoke-device="${d.id}">إلغاء</button></div>`).join('')||empty('لا توجد أجهزة موثوقة')}</div><div id="qrResult"></div></section></div>`}
function mediaRecords(){const photos=(state.data.batches||[]).flatMap(b=>(b.albums||[]).flatMap(a=>(a.photos||[]).map(p=>({...p,album_title:a.title,batch_year:b.year}))));return(state.data.media?.objects||[]).map(file=>({...file,...(photos.find(photo=>photo.object_key===file.key)||{})}))}

n.dataset.editMedia));container.querySelectorAll('[data-replace-media]').forEach(input=>input.onchange=()=>replaceMedia(input.dataset.replaceMedia,input.files[0]))}
function viewMedia(key){const file=mediaRecords().find(item=>item.key===key);if(!file)return;modal('معاينة الصورة',`<div style="text-align:center"><img src="${esc(file.url||`/media/${file.key}`)}" alt="${esc(file.alt_text||file.key)}" style="max-width:100%;max-height:65vh;object-fit:contain;border-radius:16px"><p class="muted" style="margin-top:12px">${esc(file.caption||file.key)}</p></div>`)}
function editMedia(id){const file=mediaRecords().find(item=>String(item.id)===String(id));if(!file)return toast('تعذر العثور على بيانات الصورة','error');const albums=(state.data.batches||[]).flatMap(b=>(b.albums||[]).map(a=>({...a,batch_year:b.year})));const m=modal('تعديل بيانات الصورة',`<form id="entityForm" class="form-grid"><div class="field span-2"><label>الألبوم<span class="hint">يمكن نقل الصورة إلى ألبوم آخر.</span></label><select class="select" name="album_id" required>${albums.map(a=>`<option value="${a.id}" ${a.id===file.album_id?'selected':''}>${esc(a.batch_year)} · ${esc(a.title)}</option>`).join('')}</select></div><div class="field span-2"><label>النص البديل<span class="hint">وصف مختصر يساعد الوصول والبحث.</span></label><input class="input" name="alt_text" value="${esc(file.alt_text||'')}"></div><div class="field span-2"><label>الوصف<span class="hint">يظهر عند فتح الصورة.</span></label><textarea class="textarea" name="caption">${esc(file.caption||'')}</textarea></div><div class="field"><label>الترتيب</label><input class="input" name="sort_order" type="number" min="0" value="${esc(file.sort_order||0)}"></div><label class="field" style="display:flex;flex-direction:row;align-items:center;margin-top:27px"><input name="published" type="checkbox" ${file.published?'checked':''}> منشورة للزوار</label><button class="btn btn-primary span-2">حفظ التعديلات</button></form>`);m.querySelector('form').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.id=file.id;d.published=e.target.published.checked;try{await api('/api/admin/photos',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});m.close();await refresh();toast('تم تعديل الصورة','success')}catch(error){toast(error.message,'error')}}}
async function replaceMedia(key,file){if(!file)return;const current=mediaRecords().find(item=>item.key===key);if(!current)return;try{const form=new FormData();form.append('file',file);form.append('key',key);form.append('replace','1');await api('/api/admin/upload',{method:'POST',body:form});await refresh();toast('تم استبدال الصورة','success')}catch(error){toast(error.message,'error')}}

uerySelectorAll('[data-delete-media]').forEach(b=>b.onclick=()=>deleteEntity('/api/admin/media',{key:b.dataset.deleteMedia},'الصورة'));document.querySelector('[data-refresh-media]')?.addEventListener('click',refresh);document.querySelectorAll('[data-upload-for]').forEach(b=>b.onclick=()=>{state.view='media';render();const select=document.getElementById('uploadAlbum');if(select){

async function changeMediaPage(cursor){
  try{
    state.data.media=await api('/api/admin/media?limit=50&cursor='+encodeURIComponent(cursor));
    state.mediaCursor=cursor;
    state.data.counts.media=state.data.media.objects.length;

function modal(title,body){
  const root=document.getElementById('modal-root');
  root.innerHTML=`<dialog class="modal" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${esc(title)}</h2><button class="icon-btn" id="closeModal" aria-label="إغلاق">${icons.close}</button></div>${body}</dialog>`;
  const dialog=root.querySelector('dialog');
  dialog.querySelectorAll('.field').forEach((field,index)=>{
    const label=field.querySelector(':scope > label');
    const control=field.querySelector(':scope > input,:scope > select,:scope > textarea');
    if(label&&control){control.id='entity-field-'+index;label.htmlFor=control.id}
  });
  dialog.querySelector('#closeModal').onclick=()=>dialog.close();
  dialog.addEventListener('close',()=>dialog.remove(),{once:true});
  dialog.showModal();
  return dialog;
}

function bindUploads(){
  const input=document.getElementById('fileInput');
  const drop=document.getElementById('dropzone');
  const start=document.getElementById('startUploads');
  const clear=document.getElementById('clearUploads');
  const list=document.getElementById('uploadList');
  if(!input)return;
  const pending=()=>state.uploadQueue.filter(item=>item.state==='ready'||item.state==='failed');
  function draw(){
    list.innerHTML=state.uploadQueue.map(item=>`<div class="upload-item"><div><div class="file-name">${esc(item.file.name)}</div><div class="progress"><span style="width:${item.progress}%"></span></div></div><span class="status">${esc(item.message)}</span></div>`).join('');
    start.disabled=Boolean(state.uploading)||!pending().length;
    clear.disabled=Boolean(state.uploading)||!state.uploadQueue.length;
    document.getElementById('chooseFiles').disabled=Boolean(state.uploading);
  }
  function add(files){
    if(state.uploading)return;
    const accepted=[...files].filter(file=>/^image\/(jpeg|png|webp)$/.test(file.type)&&file.size>0&&file.size<=20*1024*1024)
      .slice(0,50-state.uploadQueue.length);
    if(files.length>accepted.length)toast('تم تجاوز حد القائمة أو تجاهل ملفات غير مدعومة أو أكبر من 20 ميغابايت','error');
    state.uploadQueue.push(...accepted.map(file=>({file,progress:0,state:'ready',message:'بانتظار الرفع'})));
    draw();
  }
  document.getElementById('chooseFiles').onclick=()=>input.click();
  input.onchange=()=>{add(input.files);input.value=''};
  ['dragenter','dragover'].forEach(type=>drop.addEventListener(type,event=>{event.preventDefault();drop.classList.add('drag')}));
  ['dragleave','drop'].forEach(type=>drop.addEventListener(type,event=>{event.preventDefault();drop.classList.remove('drag')}));
  drop.addEventListener('drop',event=>add(event.dataTransfer.files));
  clear.onclick=()=>{state.uploadQueue=[];draw()};
  start.onclick=async()=>{
    const jobs=pending();
    const settings={
      album:document.getElementById('uploadAlbum').value,
      published:document.getElementById('uploadPublished').checked,
      prefix:document.getElementById('uploadPrefix').value.trim().replace(/^\/+|\/+$/g,'')
    };
    if(settings.prefix&&!/^[a-zA-Z0-9_-]+(?:\/[a-zA-Z0-9_-]+)*$/.test(settings.prefix)){
      toast('اكتب مسارًا بأحرف إنجليزية وأرقام أو شرطات فقط','error');return;
    }
    if(settings.published&&!settings.album){toast('اختر ألبومًا قبل نشر الصور','error');return}
    state.uploading=true;
    draw();
    let cursor=0;
    async function worker(){
      while(cursor<jobs.length){
        const item=jobs[cursor++];
        item.state='uploading';item.message='جارٍ الرفع';item.progress=0;draw();
        try{await uploadOne(item,settings,draw);item.state='done';item.message='تم الرفع';item.progress=100}
        catch(error){item.state='failed';item.message=error.message}
        draw();
      }
    }
    try{await Promise.all(Array.from({length:Math.min(4,jobs.length)},worker))}
    finally{state.uploading=false;draw()}
    await refresh();
    const failed=jobs.filter(item=>item.state==='failed').length;
    toast(failed?`تعذّر رفع ${failed} ملف. يمكنك إعادة المحاولة.`:'اكتمل رفع الصور',failed?'error':'success');
  };
  draw();
}
function uploadOne(item,{album,published,prefix},draw){
  const name=item.file.name.normalize('NFKD').replace(/[^a-zA-Z0-9._-]/g,'-').slice(-120);
  const folder=prefix?prefix+'/':'';
  item.key ||= `${folder}${crypto.randomUUID()}-${name}`;
  const form=new FormData();
  form.append('file',item.file);
  form.append('key',item.key);
  form.append('upload_id',item.key);
  if(album)form.append('album_id',album);
  if(published)form.append('published','1');
  return new Promise((resolve,reject)=>{
    const xhr=new XMLHttpRequest();
    xhr.open('POST','/api/admin/upload');
    xhr.timeout=120000;
    xhr.upload.onprogress=event=>{
      if(event.lengthComputable){item.progress=Math.round(event.loaded/event.total*100);draw()}
    };
    xhr.onload=()=>{
      if(xhr.status>=200&&xhr.status<300)resolve();
      else reject(Error(xhr.response?.error||'تعذّر رفع الملف'));
    };
    xhr.onerror=()=>reject(Error('انقطع الاتصال أثناء رفع الملف'));
    xhr.ontimeout=()=>reject(Error('انتهت مهلة رفع الملف'));
    xhr.responseType='json';
    xhr.send(form);
  });
}
async function initialize(){
  const url=new URL(location.href);
  const token=new URLSearchParams(url.hash.slice(1)).get('device')||url.searchParams.get('device');
  if(token){
    history.replaceState(null,'','/admin');
    try{
      await api('/api/auth/device',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
    }catch(error){login(error.message);return}
  }
  try{state.user=await api('/api/auth/me');await boot()}
  catch(error){login(error.status===401?'':error.message)}
}
initialize();
