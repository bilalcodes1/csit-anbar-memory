<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة ذاكرة الكلية</title>
  <link rel="icon" href="assets/brand/memory-icon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#f7f4ee] text-[#102a43]">
  <div id="app"></div>
  <script>
    const app = document.getElementById('app');
    let user = null;
    const request = async (url, options = {}) => {
      const response = await fetch(url, { credentials: 'same-origin', ...options });
      const body = response.status === 204 ? null : await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.error || 'تعذر تنفيذ الطلب');
      return body;
    };
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    function renderLogin(error = '') {
      app.innerHTML = `<main class="mx-auto max-w-md px-5 py-16"><div class="rounded-3xl bg-white p-7 shadow-xl"><p class="text-sm font-bold tracking-widest text-[#1f6f78]">ذاكرة الكلية</p><h1 class="mt-2 text-4xl font-bold">تسجيل الدخول</h1><p class="mt-3 leading-loose text-slate-600">لوحة إدارة الدفعات والصور والأسماء.</p><form id="login" class="mt-8 grid gap-4"><label class="text-sm font-bold">البريد الإلكتروني<input name="email" type="email" required class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3"></label><label class="text-sm font-bold">كلمة المرور<input name="password" type="password" required class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3"></label><button class="rounded-full bg-[#102a43] px-5 py-3 font-bold text-white">دخول</button></form>${error ? `<p class="mt-4 rounded-xl bg-red-50 p-3 text-sm text-red-700">${escapeHtml(error)}</p>` : ''}</div></main>`;
      document.getElementById('login').addEventListener('submit', async event => {
        event.preventDefault();
        try { const data = await request('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(Object.fromEntries(new FormData(event.target))) }); user = data.user; renderDashboard(); }
        catch (error) { renderLogin(error.message); }
      });
    }
    async function renderDashboard() {
      const batches = await request('/api/admin/batches');
      app.innerHTML = `<main class="mx-auto max-w-7xl px-5 py-8"><header class="flex flex-col justify-between gap-4 border-b border-[#102a43]/10 pb-6 sm:flex-row sm:items-center"><div><p class="text-sm font-bold tracking-widest text-[#1f6f78]">ذاكرة الكلية</p><h1 class="mt-2 text-4xl font-bold">لوحة التحكم</h1><p class="mt-2 text-slate-600">مرحبًا ${escapeHtml(user.name)} · ${user.role === 'admin' ? 'مدير' : 'مشرف'}</p></div><button id="logout" class="rounded-full border border-[#102a43]/20 px-5 py-2 font-bold">تسجيل الخروج</button></header>
      <div class="mt-8 grid gap-6 lg:grid-cols-[.8fr_1.2fr]"><section class="rounded-3xl bg-white p-6 shadow-lg"><h2 class="text-2xl font-bold">إضافة دفعة</h2><form id="batch-form" class="mt-5 grid gap-3"><input name="year" type="number" placeholder="السنة" required class="rounded-xl border p-3"><input name="title" placeholder="عنوان الدفعة" required class="rounded-xl border p-3"><select name="status" class="rounded-xl border p-3"><option value="current">حالية</option><option value="graduated">متخرجة</option></select><textarea name="quote" placeholder="الاقتباس" class="rounded-xl border p-3"></textarea><textarea name="description" placeholder="الوصف" class="rounded-xl border p-3"></textarea><label class="flex gap-2 text-sm"><input name="published" type="checkbox"> نشر مباشرة</label><button class="rounded-full bg-[#102a43] px-5 py-3 font-bold text-white">حفظ الدفعة</button></form><p id="batch-result" class="mt-3 text-sm"></p></section>
      <section class="rounded-3xl bg-white p-6 shadow-lg"><div class="flex items-center justify-between"><h2 class="text-2xl font-bold">الدفعات</h2><span class="text-sm text-slate-500">${batches.length} دفعات</span></div><div id="batch-list" class="mt-5 grid gap-3">${batches.map(batch => `<article class="rounded-2xl border p-4" data-id="${batch.id}"><div class="flex flex-wrap items-center justify-between gap-3"><div><strong class="text-xl">${escapeHtml(batch.year)} · ${escapeHtml(batch.title)}</strong><p class="mt-1 text-sm text-slate-500">${batch.published ? 'منشورة' : 'مسودة'} · ${batch.status === 'current' ? 'حالية' : 'متخرجة'}</p></div><div class="flex gap-2"><button data-publish="${batch.id}" data-value="${batch.published ? 0 : 1}" class="rounded-full bg-[#eee8da] px-3 py-2 text-sm font-bold">${batch.published ? 'إخفاء' : 'نشر'}</button>${user.role === 'admin' ? `<button data-delete="${batch.id}" class="rounded-full bg-red-50 px-3 py-2 text-sm font-bold text-red-700">حذف</button>` : ''}</div></div></article>`).join('')}</div></section></div>
      <section class="mt-6 rounded-3xl bg-white p-6 shadow-lg"><h2 class="text-2xl font-bold">رفع صورة</h2><form id="upload-form" class="mt-5 flex flex-col gap-3 sm:flex-row"><input name="key" placeholder="مسار الصورة مثل 2026/group.jpg" required class="flex-1 rounded-xl border p-3"><input name="file" type="file" accept="image/jpeg,image/png,image/webp" required class="flex-1 rounded-xl border p-3"><button class="rounded-full bg-[#c8a96b] px-5 py-3 font-bold">رفع</button></form><p id="upload-result" class="mt-3 text-sm"></p></section>
      ${user.role === 'admin' ? `<section class="mt-6 rounded-3xl bg-white p-6 shadow-lg"><h2 class="text-2xl font-bold">إدارة المشرفين</h2><form id="user-form" class="mt-5 grid gap-3 sm:grid-cols-4"><input name="name" placeholder="الاسم" required class="rounded-xl border p-3"><input name="email" type="email" placeholder="البريد" required class="rounded-xl border p-3"><input name="password" type="password" minlength="12" placeholder="كلمة المرور (12 رمزًا)" required class="rounded-xl border p-3"><select name="role" class="rounded-xl border p-3"><option value="editor">مشرف</option><option value="admin">مدير</option></select><button class="rounded-full bg-[#1f6f78] px-5 py-3 font-bold text-white sm:col-span-4">إضافة حساب</button></form><p id="user-result" class="mt-3 text-sm"></p></section>` : ''}</main>`;
      document.getElementById('logout').onclick = async () => { await request('/api/auth/logout', {method:'POST'}); user = null; renderLogin(); };
      document.getElementById('batch-form').onsubmit = async event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); data.published = event.target.published.checked; try { await request('/api/admin/batches', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)}); document.getElementById('batch-result').textContent = 'تمت إضافة الدفعة.'; renderDashboard(); } catch (error) { document.getElementById('batch-result').textContent = error.message; } };
      document.getElementById('upload-form').onsubmit = async event => { event.preventDefault(); const form = new FormData(event.target); try { const data = await request('/api/admin/upload', {method:'POST', body:form}); document.getElementById('upload-result').textContent = `تم رفع الصورة: ${data.key}`; event.target.reset(); } catch (error) { document.getElementById('upload-result').textContent = error.message; } };
      document.querySelectorAll('[data-publish]').forEach(button => button.onclick = async () => { const batch = batches.find(item => item.id === Number(button.dataset.publish)); try { await request(`/api/admin/batches/${batch.id}`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({...batch, published:Number(button.dataset.value)})}); renderDashboard(); } catch (error) { alert(error.message); } });
      document.querySelectorAll('[data-delete]').forEach(button => button.onclick = async () => { if (!confirm('هل أنت متأكد من حذف الدفعة؟')) return; try { await request(`/api/admin/batches/${button.dataset.delete}`, {method:'DELETE'}); renderDashboard(); } catch (error) { alert(error.message); } });
      const userForm = document.getElementById('user-form'); if (userForm) userForm.onsubmit = async event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); try { await request('/api/admin/users', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)}); document.getElementById('user-result').textContent = 'تمت إضافة الحساب.'; event.target.reset(); } catch (error) { document.getElementById('user-result').textContent = error.message; } };
    }
    request('/api/auth/me').then(data => { user = data; renderDashboard(); }).catch(() => renderLogin());
  </script>
</body>
</html>
