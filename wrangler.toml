name = "csit-anbar-memory"
compatibility_date = "2026-11-10"
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "csit-anbar-memory"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "csit-anbar-memory-images"

[vars]
SITE_NAME = "ذاكرة الكلية"
# Set ADMIN_SETUP_TOKEN as a secret before calling /api/auth/setup.
